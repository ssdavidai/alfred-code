# Safe/read-only until all doctor checks pass and apply is deliberately enabled.
repo_path = "~/dev/alfred"
state_dir = "~/.alfred-code-state-v2"
apply = false
poll_seconds = 60
max_parallel_planners = 3
planner_command = ["codex", "exec", "--profile", "alfred-planner", "--model", "gpt-5.6-sol", "-c", "model_reasoning_effort=\"high\"", "-c", "web_search=\"disabled\"", "-c", "mcp_servers={}", "-c", "plugins={}", "-c", "memories={generate_memories=false,use_memories=false}", "--ephemeral", "--strict-config", "--json"]
planner_timeout_seconds = 900

[github]
repo = "ssdavidai/alfred"
owner = "ssdavidai"
auto_intake = false
intake_label = "alfred-code"
approval_command = "/approve-plan"
rejection_command = "/reject-plan"
approvers = ["ssdavidai"]
reviewers = ["ssdavidai"]
project_title = "Alfred Product Control"
# project_number = 1

[superset]
cli = "/Users/ssd/.superset/bin/superset"
project_name = "alfred"
# Dedicated IDs created by `alfred-code agents-provision`. Built-in presets are rejected.
worker_agent = "2dc16f0d-1e57-4f4b-9f3f-4e7835a921d1"
reviewer_agent = "e75d43da-621f-449d-81ad-e3f92d553fd3"
workspace_prefix = "alfred-code"
api_key_env = "SUPERSET_API_KEY"
cleanup_merged_workspaces = false
worker_launch_timeout_seconds = 120
worker_progress_timeout_seconds = 1200
review_repair_max_attempts = 2

[slack]
enabled = false
webhook_env = "ALFRED_CODE_SLACK_WEBHOOK"
channel = ""
