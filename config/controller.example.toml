# Safe/read-only until all doctor checks pass and apply is deliberately enabled.
repo_path = "~/dev/alfred"
state_dir = "~/.alfred-code-state-v2"
apply = false
poll_seconds = 60
planner_command = ["claude", "-p", "--safe-mode", "--permission-mode", "plan", "--tools", "", "--no-session-persistence", "--no-chrome", "--disable-slash-commands"]
planner_timeout_seconds = 900

[github]
repo = "ssdavidai/alfred"
owner = "ssdavidai"
intake_label = "alfred-code"
approval_command = "/approve-plan"
approvers = ["ssdavidai"]
reviewers = ["ssdavidai"]
project_title = "Alfred Product Control"
# project_number = 1

[superset]
cli = "/Users/ssd/.superset/bin/superset"
project_name = "alfred"
worker_agent = "Claude"
reviewer_agent = "Codex"
workspace_prefix = "alfred-code"
api_key_env = "SUPERSET_API_KEY"
cleanup_merged_workspaces = false

[slack]
enabled = false
webhook_env = "ALFRED_CODE_SLACK_WEBHOOK"
channel = ""
