[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alfred-code-controller"
version = "1.0.0"
description = "Deterministic GitHub control plane and Superset execution runner for Alfred"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
alfred-code = "alfred_code.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alfred_code = ["static/*.html"]
